# Deploy to Azure with azd, signing in with GitHub OIDC (no secrets in the repo).
# One-time setup by the subscription owner: `azd pipeline config` (creates the federated
# credential and the AZURE_* repository variables used below).
name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign in (OIDC)
        run: |
          azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"
      - name: Provision and deploy
        run: azd up --no-prompt
