name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Schema drift (models must match /schemas)
        run: |
          ./scripts/gen_models.sh
          git diff --exit-code -- services/contracts
      - name: Tests (includes the 50-run totals acceptance check)
        run: uv run pytest
