[project]
name = "pitchside-ai"
version = "0.1.0"
description = "Multi-agent live match intelligence over a synthetic football match engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-openai>=1.17.0",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    # Agent Framework's MCP tools are built on the 1.x SDK (agent-framework-core pins <2).
    "mcp>=1.30.0,<2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.optional-dependencies]
# Azure mode only: Event Hubs, Cosmos DB, Web PubSub, managed identity, App Insights.
azure = [
    "agent-framework-foundry>=1.15.0",
    "azure-cosmos>=4.17.1",
    "azure-eventhub>=5.15.1",
    "azure-identity>=1.26.0",
    "azure-messaging-webpubsubservice>=1.3.0",
    "azure-monitor-opentelemetry>=1.8.11",
]

[project.scripts]
pitchside-sim = "sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/sim", "services/contracts", "services/stats", "services/runtime", "services/ingestor", "services/mcp_stats", "services/agents", "services/gateway"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# cryptography 49+ ships no wheel for Intel macOS, so uv would compile it from Rust source
# on those dev machines. 48.0.1 has universal2 wheels; see docs/DECISIONS.md (D13).
constraint-dependencies = ["cryptography<49"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"services/contracts/*.py" = ["E501", "RUF"]
# Phrase tables in five languages: long lines and non-ASCII punctuation are the content.
"services/agents/i18n.py" = ["E501", "RUF001"]
"services/agents/mock_phrases.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["sim", "contracts", "stats", "runtime", "ingestor", "mcp_stats", "agents", "gateway"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services"
packages = ["sim", "contracts", "stats", "runtime", "ingestor", "mcp_stats", "agents", "gateway"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs many full simulated matches"]
